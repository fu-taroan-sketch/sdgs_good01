<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  .wrap { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  video { max-width: 100%; max-height: 100%; }
  #unmute {
    position: absolute; right: 16px; bottom: 16px;
    padding: 10px 16px; border: 0; border-radius: 999px;
    background: rgba(0,0,0,.6); color: #fff; font-size: 14px; cursor: pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <!-- autoplay には muted が必須（ブラウザの自動再生ポリシー） -->
  <video id="v" src="video.mp4" poster="poster.jpg"
         autoplay muted loop playsinline preload="auto"></video>
  <button id="unmute" hidden>🔊 音を出す</button>
</div>
<script>
  const v = document.getElementById('v');
  const btn = document.getElementById('unmute');
  // 念のため明示的にも再生を試みる
  v.play().catch(() => {});
  btn.hidden = false;
  btn.addEventListener('click', () => {
    v.muted = false;
    v.play();
    btn.hidden = true;
  });
</script>
</body>
</html>
